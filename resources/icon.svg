<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Logo do Modelador: um pequeno diagrama de arquitetura (três blocos ligados) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Fundo: grade de ícones do macOS (824 px com margem de 100) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- Pontos da grade, como no fundo do desenho -->
  <g fill="#ffffff" fill-opacity="0.07">
    <circle cx="232" cy="232" r="7"/><circle cx="372" cy="232" r="7"/><circle cx="652" cy="232" r="7"/><circle cx="792" cy="232" r="7"/>
    <circle cx="232" cy="792" r="7"/><circle cx="512" cy="792" r="7"/><circle cx="792" cy="792" r="7"/>
    <circle cx="232" cy="512" r="7"/><circle cx="792" cy="512" r="7"/>
  </g>
  <!-- Ligações (cantos retos, como as setas do app) -->
  <g fill="none" stroke="#94a3b8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 400 V500 H330 V590"/>
    <path d="M512 400 V500 H694 V590"/>
  </g>
  <circle cx="512" cy="500" r="20" fill="#94a3b8"/>
  <!-- Bloco de cima: em destaque (azul da seleção) -->
  <rect x="352" y="250" width="320" height="150" rx="34" fill="url(#accent)"/>
  <rect x="402" y="306" width="150" height="20" rx="10" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="402" y="342" width="96" height="16" rx="8" fill="#ffffff" fill-opacity="0.6"/>
  <!-- Blocos de baixo -->
  <rect x="196" y="590" width="268" height="150" rx="34" fill="#f8fafc"/>
  <rect x="240" y="646" width="124" height="20" rx="10" fill="#334155"/>
  <rect x="240" y="682" width="80" height="16" rx="8" fill="#94a3b8"/>
  <rect x="567" y="597" width="254" height="136" rx="27" fill="#f8fafc" stroke="#10b981" stroke-width="14"/>
  <rect x="604" y="646" width="124" height="20" rx="10" fill="#334155"/>
  <rect x="604" y="682" width="80" height="16" rx="8" fill="#94a3b8"/>
</svg>
