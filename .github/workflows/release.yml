# Gera os instaladores do Modelador (Windows e macOS) a cada push na master/main e publica na página de
# Releases do GitHub. Também pode ser disparado à mão (aba Actions → Release → Run workflow).
name: Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Um push novo cancela o build anterior que ainda estiver rodando
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Windows
            os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # typecheck + build em out/
      - name: Build
        run: npm run build

      # Sem certificados: apps não assinados (veja o README)
      - name: Empacotar
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: modelador-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publicar na página de Releases
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true

      # Uma release por push: versão do package.json + número da execução (ex.: v0.1.0-build.12)
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-build.${{ github.run_number }}"
          cat > notas.md <<EOF
          Build automático do commit ${GITHUB_SHA::7} (${{ github.ref_name }}).

          **Windows**
          - \`Modelador-${VERSION}-windows-instalador.exe\`: instalador.
          - \`Modelador-${VERSION}-windows-portatil.exe\`: roda sem instalar.

          **macOS**
          - \`Modelador-${VERSION}-mac-arm64.dmg\`: Macs com Apple Silicon (M1, M2, M3…).
          - \`Modelador-${VERSION}-mac-x64.dmg\`: Macs com Intel.
          - Os \`.zip\` têm o mesmo app, sem instalador.

          Os apps não são assinados. No Windows, em "O Windows protegeu o computador", clique em
          "Mais informações" → "Executar assim mesmo". No macOS, na primeira vez, clique com o botão direito no
          app → "Abrir" (ou rode \`xattr -cr /Applications/Modelador.app\`).
          EOF
          gh release create "$TAG" artefatos/* \
            --title "Modelador ${VERSION} (build ${{ github.run_number }})" \
            --notes-file notas.md \
            --target "$GITHUB_SHA"
